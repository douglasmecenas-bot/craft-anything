name: Craft isolated evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1f8508a104134c436cbba5ea2f675619ef47702f
          path: source
          persist-credentials: false
      - name: Install Ubuntu build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - name: Verify versions and formatting
        run: |
          rustup run 1.97.0 rustc --version
          rustup run 1.97.0 cargo --version
          rustup run 1.97.0 cargo fmt --all -- --check
      - name: Fetch locked dependencies
        run: rustup run 1.97.0 cargo fetch --locked
      - name: Dependency graph
        run: rustup run 1.97.0 cargo tree --locked --offline
      - name: Build and test
        run: |
          rustup run 1.97.0 cargo build --workspace --locked --offline
          rustup run 1.97.0 cargo test --workspace --locked --offline
          rustup run 1.97.0 cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: License and advisory audit
        run: |
          rustup run 1.97.0 cargo install cargo-deny --version 0.18.4 --locked
          rustup run 1.97.0 cargo deny check
      - name: Real MCP in network namespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          chmod 755 "$root"
          cp target/debug/craft-anything-cli "$root/craft-cli"
          cp ../harness/.github/craft-secure-eval/mcp_real_probe.py "$root/probe.py"
          chmod 755 "$root/craft-cli"
          chmod 644 "$root/probe.py"
          sudo unshare --net -- setpriv --reuid nobody --regid nogroup --init-groups --no-new-privs python3 "$root/probe.py" "$root/craft-cli"
